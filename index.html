<!DOCTYPE html>
<html>
<head>
  <title>Snake</title>
  <style>
    body {
      background: #111;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 3px solid #333;
    }
  </style>
</head>
<body>
  <canvas id="game" width="780" height="830"></canvas>

  <script>
    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");

    var size = 30;
    var cols = 26;
    var topBar = 50;
    var wallThickness = 4;
    var w = size * cols;
    var h = size * cols + topBar;
    canvas.width = w;
    canvas.height = h;

    // start screen box and button
    var panelW = 460;
    var panelX = (w - panelW) / 2;
    var panelY = h / 2 - 150;
    var btnX = w / 2 - 80;
    var btnY = panelY + 205;
    var btnW = 160;
    var btnH = 50;

    var snake = [{x: cols / 2, y: cols / 2}];
    var dx = 1;
    var dy = 0;
    var newDx = 1;
    var newDy = 0;
    var score = 0;
    var lives = 3;
    var gameOver = false;
    var paused = false;
    var started = false;
    var food = makeFood();

    function onSnake(x, y) {
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x == x && snake[i].y == y) {
          return true;
        }
      }
      return false;
    }

    function makeFood() {
      while (true) {
        var fx = Math.floor(Math.random() * cols);
        var fy = Math.floor(Math.random() * cols);
        if (!onSnake(fx, fy)) {
          return {x: fx, y: fy};
        }
      }
    }

    function resetSnake() {
      snake = [{x: cols / 2, y: cols / 2}];
      dx = 1;
      dy = 0;
      newDx = 1;
      newDy = 0;
    }

    function circle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    document.addEventListener("keydown", function (e) {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
      }

      // start screen: space or enter starts the game
      if (!started) {
        if (e.key == " " || e.key == "Enter") {
          started = true;
        }
        return;
      }

      if (e.key == "ArrowUp" && dy != 1) {
        newDx = 0;
        newDy = -1;
      } else if (e.key == "ArrowDown" && dy != -1) {
        newDx = 0;
        newDy = 1;
      } else if (e.key == "ArrowLeft" && dx != 1) {
        newDx = -1;
        newDy = 0;
      } else if (e.key == "ArrowRight" && dx != -1) {
        newDx = 1;
        newDy = 0;
      }
      if (e.key == " " && gameOver) {
        resetSnake();
        food = makeFood();
        score = 0;
        lives = 3;
        gameOver = false;
      }
    });

    // clicking the start button
    canvas.addEventListener("click", function (e) {
      if (started) {
        return;
      }
      var rect = canvas.getBoundingClientRect();
      var mx = e.clientX - rect.left - canvas.clientLeft;
      var my = e.clientY - rect.top - canvas.clientTop;
      if (mx > btnX && mx < btnX + btnW && my > btnY && my < btnY + btnH) {
        started = true;
      }
    });

    function update() {
      if (!started || gameOver || paused) {
        return;
      }
      dx = newDx;
      dy = newDy;
      var headX = snake[0].x + dx;
      var headY = snake[0].y + dy;

      var hitWall = headX < 0 || headX >= cols || headY < 0 || headY >= cols;
      var hitSelf = onSnake(headX, headY);

      // hitting the wall or yourself costs a life
      if (hitWall || hitSelf) {
        lives -= 1;
        if (lives == 0) {
          gameOver = true;
        } else {
          paused = true;
          setTimeout(function () {
            resetSnake();
            paused = false;
          }, 700);
        }
      } else {
        snake.unshift({x: headX, y: headY});
        if (headX == food.x && headY == food.y) {
          score += 1;
          food = makeFood();
        } else {
          snake.pop();
        }
      }
    }

    function draw() {
      // background and top bar
      ctx.fillStyle = "#f5e6a8";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#e8d48a";
      ctx.fillRect(0, 0, w, topBar);

      // grid
      ctx.strokeStyle = "#d4c078";
      ctx.lineWidth = 1;
      for (var i = 0; i <= cols; i++) {
        ctx.beginPath();
        ctx.moveTo(i * size, topBar);
        ctx.lineTo(i * size, h);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, topBar + i * size);
        ctx.lineTo(w, topBar + i * size);
        ctx.stroke();
      }

      // red walls
      ctx.fillStyle = "#be2323";
      ctx.fillRect(0, topBar, w, wallThickness);
      ctx.fillRect(0, h - wallThickness, w, wallThickness);
      ctx.fillRect(0, topBar, wallThickness, size * cols);
      ctx.fillRect(w - wallThickness, topBar, wallThickness, size * cols);

      // apple
      var ax = food.x * size + 15;
      var ay = topBar + food.y * size + 17;
      circle(ax, ay, 11, "#dc1e1e");
      circle(ax - 4, ay - 3, 3, "#ff8c8c");
      ctx.strokeStyle = "#6e461e";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ax, ay - 9);
      ctx.lineTo(ax + 2, ay - 14);
      ctx.stroke();
      ctx.fillStyle = "#3cb43c";
      ctx.beginPath();
      ctx.ellipse(ax + 6, ay - 13, 5, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // snake body
      ctx.fillStyle = "#46c85f";
      for (var i = 1; i < snake.length; i++) {
        ctx.beginPath();
        ctx.roundRect(snake[i].x * size + 2, topBar + snake[i].y * size + 2, size - 4, size - 4, 8);
        ctx.fill();
      }

      // snake head
      var hx = snake[0].x;
      var hy = snake[0].y;
      ctx.fillStyle = "#2da54b";
      ctx.beginPath();
      ctx.roundRect(hx * size + 1, topBar + hy * size + 1, size - 2, size - 2, 10);
      ctx.fill();

      // eyes
      var cx = hx * size + 15;
      var cy = topBar + hy * size + 15;
      for (var side = -1; side <= 1; side += 2) {
        var ex = cx + dx * 5 - dy * 7 * side;
        var ey = cy + dy * 5 + dx * 7 * side;
        circle(ex, ey, 5, "white");
        circle(ex + dx * 2, ey + dy * 2, 2, "black");
      }

      // score and hearts
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.fillStyle = "#2a2410";
      ctx.font = "24px Arial";
      ctx.fillText("Score: " + score, 15, 25);
      for (var i = 0; i < lives; i++) {
        var heartX = w - 30 - i * 32;
        circle(heartX - 5, 22, 6, "#e62840");
        circle(heartX + 5, 22, 6, "#e62840");
        ctx.fillStyle = "#e62840";
        ctx.beginPath();
        ctx.moveTo(heartX - 11, 24);
        ctx.lineTo(heartX + 11, 24);
        ctx.lineTo(heartX, 36);
        ctx.fill();
      }

      // controls hint in the top bar
      ctx.textAlign = "center";
      ctx.fillStyle = "#6b5d2a";
      ctx.font = "16px Arial";
      ctx.fillText("Arrow keys to steer", w / 2, 25);

      if (!started) {
        // start screen
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.roundRect(panelX, panelY, panelW, 300, 15);
        ctx.fill();
        ctx.strokeStyle = "#46c85f";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = "white";
        ctx.font = "bold 52px Arial";
        ctx.fillText("SNAKE", w / 2, panelY + 45);
        ctx.font = "20px Arial";
        ctx.fillText("Arrow keys: steer the snake", w / 2, panelY + 110);
        ctx.fillText("Eat apples to grow", w / 2, panelY + 140);
        ctx.fillText("Red wall or yourself = lose a life", w / 2, panelY + 170);

        // start button
        ctx.fillStyle = "#46c85f";
        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 10);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.font = "bold 26px Arial";
        ctx.fillText("START", w / 2, btnY + 26);
        ctx.fillStyle = "#c8c8c8";
        ctx.font = "14px Arial";
        ctx.fillText("or press SPACE", w / 2, btnY + 75);
      } else if (gameOver) {
        // game over box
        var boxW = 400;
        var boxX = (w - boxW) / 2;
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.roundRect(boxX, h / 2 - 90, boxW, 180, 15);
        ctx.fill();
        ctx.strokeStyle = "#be2323";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.fillStyle = "white";
        ctx.font = "bold 52px Arial";
        ctx.fillText("GAME OVER", w / 2, h / 2 - 40);
        ctx.font = "24px Arial";
        ctx.fillText("Final score: " + score, w / 2, h / 2 + 10);
        ctx.fillStyle = "#c8c8c8";
        ctx.fillText("Press SPACE to play again", w / 2, h / 2 + 50);
      }
    }

    setInterval(function () {
      update();
      draw();
    }, 125);
  </script>
</body>
</html>
